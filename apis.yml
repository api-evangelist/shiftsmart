aid: shiftsmart
name: Shiftsmart
description: 'Shiftsmart is a workforce management and flexible-labor platform that
  connects enterprises and government agencies with a community of independent workers
  across more than 50 countries. The platform covers the full labor lifecycle — sourcing
  workers from profiles carrying credentials and performance metrics, onboarding and
  training them into custom labor pools, building optimized schedules from rules and
  templates, dispatching shifts by in-app notification or SMS, tracking GPS-verified
  attendance and productivity, and paying workers within 24 hours via real-time debit
  transfers and payroll integrations. Shiftsmart also runs location-level audits, mystery
  shopping and compliance programs on top of the same labor network. The platform is
  delivered through worker and manager mobile applications backed by a private REST
  API at api.shiftsmart.com; Shiftsmart publishes no public developer portal, API reference,
  or machine-readable specification.'

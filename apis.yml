apis:
- aid: shiftsmart:shiftsmart-platform-api
  name: Shiftsmart Platform API
  description: 'The private REST API backing the Shiftsmart worker and manager applications.
    Probing confirms a live FeathersJS service at api.shiftsmart.com: an unauthenticated
    GET /health returns 200, service collections such as /shifts return 401 NotAuthenticated,
    and POST /authentication returns a FeathersJS authentication error demanding a
    `strategy`. No OpenAPI, Swagger, GraphQL, AsyncAPI or MCP surface is published
    at any Shiftsmart host, and there is no public developer portal or API reference,
    so this API is not generally available to third-party developers.'
